              template: |
                <ul class="list list-gap-10">
                  {{ range .JSON.Array "records" }}{{ if eq (.Int "division.id") 205 }}{{ range .Array "teamRecords" }}
                  <li class="flex items-center gap-15">
                    <div class="flex-shrink-0" style="width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                      <img src="https://www.mlbstatic.com/team-logos/{{ .Int "team.id" }}.svg" style="width: 28px; height: 28px;" alt="{{ .String "team.name" }}">
                    </div>
                    <div class="flex-grow min-w-0">
                      <div class="flex justify-between items-baseline">
                        <span class="size-h4 color-highlight text-truncate">{{ .String "team.name" }}</span>
                        <span class="size-h6 color-paragraph">{{ .String "gamesBack" }} GB</span>
                      </div>
                      <div class="flex justify-between items-baseline">
                        <span class="size-h6 color-paragraph">{{ .Int "wins" }}-{{ .Int "losses" }}</span>
                        <span class="size-h6 {{ if eq (slice (.String "streak.streakCode") 0 1) "W" }}color-positive{{ else }}color-negative{{ end }}">{{ .String "streak.streakCode" }}</span>
                      </div>
                    </div>
                  </li>
                  {{ end }}{{ end }}{{ end }}
                </ul>
