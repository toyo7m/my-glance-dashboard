- name: Home
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 12h

        # Cubs command center. Hits statsapi directly — no Worker. The main
        # request carries NEXT + LAST via schedule hydration (no date math);
        # the `today` subrequest carries the linescore, which only appears on
        # the schedule endpoint, for the LIVE case.
        - type: custom-api
          css-class: no-header
          cache: 2m
          # DO NOT "simplify" the nested hydrate: statsapi only returns
          # probablePitcher when `linescore` precedes it in the list. Both
          # `hydrate=probablePitcher` alone and `hydrate=probablePitcher,linescore`
          # silently return no pitcher. Verified 2026-08-05.
          url: https://statsapi.mlb.com/api/v1/teams/112?hydrate=nextSchedule(limit=1,hydrate=linescore,probablePitcher),previousSchedule(limit=1)
          subrequests:
            today:
              url: https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=112&hydrate=linescore,team
            standings:
              url: https://statsapi.mlb.com/api/v1/standings?leagueId=104&standingsTypes=regularSeason
          template: |
            {{ $next := .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.gameDate" }}
            {{ $prev := .JSON.String "teams.0.previousGameSchedule.dates.0.games.0.gameDate" }}
            {{ $today := .Subrequest "today" }}
            {{ $liveState := $today.JSON.String "dates.0.games.0.status.abstractGameState" }}

            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
              <span class="size-h3 color-highlight">Cubs</span>
              {{ range (.Subrequest "standings").JSON.Array "records" }}{{ if eq (.Int "division.id") 205 }}{{ range .Array "teamRecords" }}{{ if eq (.Int "team.id") 112 }}
              <span class="size-h6 color-paragraph">{{ .Int "wins" }}-{{ .Int "losses" }} · {{ .String "divisionRank" }} NL Central</span>
              {{ end }}{{ end }}{{ end }}{{ end }}
            </div>

            {{ if eq $liveState "Live" }}
              <div class="size-h6 color-positive" style="margin-bottom:4px;">● LIVE · {{ $today.JSON.String "dates.0.games.0.linescore.currentInningOrdinal" }} · {{ $today.JSON.Int "dates.0.games.0.linescore.outs" }} out</div>
              <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0;">
                <img src="https://www.mlbstatic.com/team-logos/{{ $today.JSON.Int "dates.0.games.0.teams.away.team.id" }}.svg" style="width:26px;height:26px;">
                <span class="size-h2 color-highlight">{{ $today.JSON.Int "dates.0.games.0.teams.away.score" }}</span>
                <span class="size-h5 color-paragraph">–</span>
                <span class="size-h2 color-highlight">{{ $today.JSON.Int "dates.0.games.0.teams.home.score" }}</span>
                <img src="https://www.mlbstatic.com/team-logos/{{ $today.JSON.Int "dates.0.games.0.teams.home.team.id" }}.svg" style="width:26px;height:26px;">
              </div>
            {{ else if $next }}
              <div class="size-h6 color-paragraph">NEXT</div>
              <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0;">
                <img src="https://www.mlbstatic.com/team-logos/{{ .JSON.Int "teams.0.nextGameSchedule.dates.0.games.0.teams.away.team.id" }}.svg" style="width:26px;height:26px;">
                <span class="size-h5 color-highlight">{{ .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.teams.away.team.name" }}</span>
                <span class="size-h6 color-paragraph">@</span>
                <span class="size-h5 color-highlight">{{ .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.teams.home.team.name" }}</span>
                <img src="https://www.mlbstatic.com/team-logos/{{ .JSON.Int "teams.0.nextGameSchedule.dates.0.games.0.teams.home.team.id" }}.svg" style="width:26px;height:26px;">
              </div>
              <div class="size-h6 color-paragraph" style="text-align:center;">
                {{ .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.teams.away.probablePitcher.fullName" }} · {{ .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.teams.home.probablePitcher.fullName" }}
              </div>
              <div class="size-h6 color-paragraph" style="text-align:center; opacity:.6;">{{ .JSON.String "teams.0.nextGameSchedule.dates.0.games.0.venue.name" }}</div>
            {{ end }}

            {{ if $prev }}
              <div style="border-top:1px solid rgba(255,255,255,0.08); margin-top:10px; padding-top:8px; text-align:center;">
                <span class="size-h6 color-paragraph">LAST</span>
                <div class="size-h5 color-highlight">
                  {{ .JSON.String "teams.0.previousGameSchedule.dates.0.games.0.teams.away.team.name" }} {{ .JSON.Int "teams.0.previousGameSchedule.dates.0.games.0.teams.away.score" }}
                  –
                  {{ .JSON.Int "teams.0.previousGameSchedule.dates.0.games.0.teams.home.score" }} {{ .JSON.String "teams.0.previousGameSchedule.dates.0.games.0.teams.home.team.name" }}
                </div>
              </div>
            {{ end }}

        # Division standings. NOTE: statsapi IGNORES the divisionId parameter —
        # it always returns all three divisions of the league. The old config
        # indexed records.0/1/2 positionally, which worked only by luck; these
        # select on division.id instead, so a change in API ordering can't
        # silently show the wrong division.
        #   NL 104: East 204, Central 205, West 203
        #   AL 103: East 201, Central 202, West 200
        - type: group
          css-class: mo-mlb
          widgets:
            - type: custom-api
              title: NL Central
              url: https://statsapi.mlb.com/api/v1/standings?leagueId=104&standingsTypes=regularSeason
              cache: 15m
              template: |
                <ul class="list list-gap-10">
                  {{ range .JSON.Array "records" }}{{ if eq (.Int "division.id") 205 }}{{ range .Array "teamRecords" }}
                  <li class="flex items-center gap-15">
                    <div class="flex-shrink-0" style="width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                      <img src="https://www.mlbstatic.com/team-logos/{{ .Int "team.id" }}.svg" style="width: 28px; height: 28px;" alt="{{ .String "team.name" }}">
                    </div>
                    <div class="flex-grow min-w-0">
                      <div class="flex justify-between items-baseline">
                        <span class="size-h4 color-highlight text-truncate">{{ .String "team.name" }}</span>
                        <span class="size-h6 color-paragraph">{{ .String "gamesBack" }} GB</span>
                      </div>
                      <div class="flex justify-between items-baseline">
                        <span class="size-h6 color-paragraph">{{ .Int "wins" }}-{{ .Int "losses" }}</span>
                        <span class="size-h6 {{ if eq (slice (.String "streak.streakCode") 0 1) "W" }}color-positive{{ else }}color-negative{{ end }}">{{ .String "streak.streakCode" }}</span>
                      </div>
                    </div>
                  </li>
                  {{ end }}{{ end }}{{ end }}
                </ul>
