        # Calendar agenda. STILL VIA THE WORKER, deliberately: Glance's native
        # `calendar` widget is a month grid with no event support, and custom-api
        # templates JSON, not ICS. The Worker's /calendar is an ICS->JSON
        # transformer, not an HF workaround, so it survives the move.
        - type: custom-api
          css-class: mo-upcoming
          title: Upcoming
          cache: 10m
          url: ${WORKER_URL}/calendar?limit=12&days=45
          headers:
            X-Dashboard-Key: ${DASHBOARD_KEY}
          # A non-200 (e.g. a DASHBOARD_KEY mismatch with the Worker) otherwise
          # renders as an empty `events` array, which looks identical to a
          # genuinely clear calendar. Say so out loud instead — a silent empty
          # state hides a broken key.
          template: |
            {{ if ne .Response.StatusCode 200 }}
              <p class="color-negative">Calendar unavailable — Worker returned HTTP {{ .Response.StatusCode }}.</p>
            {{ else }}
            {{ $events := .JSON.Array "events" }}
            {{ if eq (len $events) 0 }}
              <p class="color-paragraph" style="opacity:.6">Nothing on the calendar.</p>
            {{ else }}
            <ul class="list list-gap-10">
              {{ range $events }}
              {{ $today := .Bool "isToday" }}
              <li class="flex items-center gap-15">
                <div style="flex-shrink:0; min-width:42px; text-align:center; line-height:1.15;">
                  <div class="size-h6 color-paragraph" style="text-transform:uppercase; letter-spacing:.5px;">{{ .String "weekday" }}</div>
                  <div class="size-h3 {{ if $today }}color-primary{{ else }}color-highlight{{ end }}">{{ .String "day" }}</div>
                  <div class="size-h6 color-paragraph" style="text-transform:uppercase;">{{ .String "month" }}</div>
                </div>
                <div class="flex-grow" style="min-width:0; overflow:hidden;">
                  <div class="size-h4 {{ if $today }}color-primary{{ else }}color-highlight{{ end }}" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere;">{{ .String "title" }}</div>
                  <div class="size-h6 color-paragraph text-truncate">{{ .String "time" }}{{ if .String "location" }} · {{ .String "location" }}{{ end }}</div>
                </div>
              </li>
              {{ end }}
            </ul>
            {{ end }}
            {{ end }}

