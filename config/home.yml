                        <span class="size-h6 {{ if eq (slice (.String "streak.streakCode") 0 1) "W" }}color-positive{{ else }}color-negative{{ end }}">{{ .String "streak.streakCode" }}</span>
                      </div>
                    </div>
                  </li>
                  {{ end }}{{ end }}{{ end }}
                </ul>
